# Publishes sujeetpalanisamy.com.
#
# The site is built in the private repo TheShade88/portfolio-source. Its workflow uploads the built site as an
# artifact named "site", then starts this workflow with that run's id. This workflow downloads the artifact and
# hands it to GitHub Pages as a deployment. No build is ever committed to this repo, so there is no history of
# old builds to read.
#
# Needs one secret here (Settings > Secrets and variables > Actions):
#   PUBLISH_TOKEN  fine-grained token for TheShade88/portfolio-source and this repo, Actions: read and write.
#                  The same token is set in portfolio-source, which uses it to start this workflow.
# Pages must be set to "GitHub Actions" as its source (Settings > Pages), with the custom domain set there.
name: Publish the site
run-name: Publish the build from portfolio-source run ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id in TheShade88/portfolio-source whose "site" artifact to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Only a build of portfolio-source's main branch is published.
      - name: Check the source run
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "run_id must be a number"; exit 1; }
          branch=$(gh api "repos/TheShade88/portfolio-source/actions/runs/$RUN_ID" --jq .head_branch)
          [ "$branch" = main ] || { echo "Run $RUN_ID built '$branch', not main"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
          repository: TheShade88/portfolio-source
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.PUBLISH_TOKEN }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true # .well-known/security.txt
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
